services:
  redis:
    image: redis:8
    container_name: my-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
  db:
    image: postgres:18
    container_name: my-postgres
    environment:
      POSTGRES_DB: opentorwart
      POSTGRES_USER: opentorwart
      POSTGRES_PASSWORD: opentorwart
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local